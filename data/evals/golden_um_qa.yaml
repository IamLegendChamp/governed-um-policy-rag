# P01 golden set — LLM-as-a-Judge + optional chunk_id assertions (synthetic UM)
# Used in phase 6: tests/p01/test_judge_eval.py

version: "1.0"
cases:
  - id: UM-001
    question: "What is step therapy?"
    must_include_chunk_ids: []  # fill after you know retrieval ids, e.g. C0009
    must_include_doc_types: ["um_policy"]
    rubric: "Answer must describe trial of preferred drugs before exceptions; no clinical diagnosis."

  - id: UM-002
    question: "How long do members have to appeal a medical necessity denial?"
    must_include_doc_types: ["um_policy"]
    rubric: "Must mention 60 calendar days for standard appeals; may mention expedited appeals."

  - id: UM-003
    question: "What is hybrid RAG?"
    must_include_doc_types: ["engineering_reference"]
    rubric: "Should describe keyword + vector retrieval; ok to refuse if only UM chunks retrieved."
